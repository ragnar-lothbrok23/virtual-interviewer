[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    e2e: real-browser end-to-end tests (run with --e2e)
    deepface: tests that load the real DeepFace/TensorFlow models (run with --deepface)
    real_emotion_model: runs the real HSEmotion model (skipped when its files are not downloaded)
filterwarnings =
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:keras.*
