<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f6f8fb;font-family:Segoe UI,Arial,sans-serif;color:#212529;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8fb;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:10px;overflow:hidden;">
        <tr><td style="background:#0d6efd;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:600;">{{ app_name }}</td></tr>
        <tr><td style="padding:24px;font-size:15px;line-height:1.55;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 24px;font-size:12px;color:#6c757d;border-top:1px solid #e9ecef;">
          This is an automated message from {{ app_name }}. Please do not reply to this email.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
