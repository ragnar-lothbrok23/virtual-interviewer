{% extends "base.html" %}
{% block title %}Interview room{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-camera-video display-4 text-primary"></i>
  <h3 class="mt-3">Interview room</h3>
  <p class="text-muted">{{ i.application.job.title }} · {{ i.starts_at|localtime }}</p>
  <p class="text-muted">The live interview room is being built in the next phase.</p>
  <a href="{{ url_for('candidate.interview', interview_id=i.id) }}" class="btn btn-outline-primary">Back to interview details</a>
</div>
{% endblock %}
